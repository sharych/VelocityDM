name: Release Build & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = "${{ github.ref_name }}"
          }
          $clean = $raw.TrimStart('v')
          if ($clean -notmatch '^\d+\.\d+\.\d+') { $clean = '2.0.0' }
          echo "tag=v$clean" >> $env:GITHUB_OUTPUT
          echo "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Test
        run: |
          dotnet restore VelocityDM.sln
          dotnet build VelocityDM.sln -c Release --no-restore
          dotnet test VelocityDM.sln -c Release --no-build

      - name: Publish Framework-Dependent App for Smart Installer
        run: dotnet publish src/VelocityDM.App/VelocityDM.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=None -p:DebugSymbols=false -o dist/installer-app

      - name: Publish Self-Contained Portable Win-x64 App
        run: dotnet publish src/VelocityDM.App/VelocityDM.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=None -p:DebugSymbols=false -o dist/portable-app

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path "dist/portable-app/*" -DestinationPath "dist/release/VelocityDM-${{ steps.ver.outputs.tag }}-win-x64-portable.zip" -Force

      - name: Install Inno Setup & Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist\installer-app" "/DOutputDir=$PWD\dist\release" "installer\VelocityDM.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location dist/release
          $lines = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.exe
            dist/release/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "VelocityDM ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
