name: Release Build & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (e.g. v2.4.0)'
        required: true
        default: 'v2.4.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine Version
        id: ver
        shell: bash
        run: |
          raw="${{ github.event.inputs.tag }}"
          if [ -z "$raw" ]; then
            raw="${{ github.ref_name }}"
          fi
          clean="${raw#v}"
          if ! [[ "$clean" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            clean="2.4.0"
          fi
          echo "tag=v$clean" >> "$GITHUB_OUTPUT"
          echo "version=$clean" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        shell: pwsh
        run: |
          dotnet restore VelocityDM.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build VelocityDM.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run .NET Unit Tests
        run: dotnet test VelocityDM.sln -c Release --no-build

      - name: Run Chrome Extension Tests
        run: node --test tests/extension/background.test.mjs

      - name: Publish Framework-Dependent App for Smart Installer
        run: dotnet publish src/VelocityDM.App/VelocityDM.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ needs.determine-version.outputs.version }} -p:DebugType=None -p:DebugSymbols=false -o dist/installer-app

      - name: Publish Self-Contained Portable Win-x64 App
        run: dotnet publish src/VelocityDM.App/VelocityDM.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ needs.determine-version.outputs.version }} -p:DebugType=None -p:DebugSymbols=false -o dist/portable-app

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path "dist/portable-app/*" -DestinationPath "dist/release/VelocityDM-${{ needs.determine-version.outputs.tag }}-win-x64-portable.zip" -Force

      - name: Install Inno Setup & Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ needs.determine-version.outputs.version }}" "/DSourceDir=$PWD\dist\installer-app" "/DOutputDir=$PWD\dist\release" "installer\VelocityDM.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/release/*.exe
            dist/release/*.zip

  build-macos:
    needs: determine-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Chrome Extension Tests
        run: node --test tests/extension/background.test.mjs

      - name: Build macOS Apple Silicon (osx-arm64) DMG
        run: bash scripts/build-macos-dmg.sh osx-arm64 "${{ needs.determine-version.outputs.version }}"

      - name: Build macOS Intel (osx-x64) DMG
        run: bash scripts/build-macos-dmg.sh osx-x64 "${{ needs.determine-version.outputs.version }}"

      - name: Upload macOS Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/macos/*.dmg

  publish:
    needs: [determine-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: dist/release

      - name: Download macOS Assets
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: dist/release

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist/release
          sha256sum VelocityDM* | sort -k2 > SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: "VelocityDM ${{ needs.determine-version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/SHA256SUMS.txt
