name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VelocityDM.sln

      - name: Build Release
        run: dotnet build VelocityDM.sln -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test VelocityDM.sln -c Release --no-build --verbosity normal
